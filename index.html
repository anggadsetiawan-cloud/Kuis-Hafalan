<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kuis Hafalan</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1efff;--c:#fff;--t:#222a52;--p:#3a4cb5;--ok:#2f9e6e;--no:#d9456b;--bd:#d5d2f2}
@media(prefers-color-scheme:dark){:root{--bg:#161a36;--c:#20264d;--t:#eceeff;--p:#7f8cf0;--bd:#38407a}}
*{box-sizing:border-box}
body{margin:0 auto;max-width:560px;padding:16px;font-family:Nunito,system-ui,sans-serif;font-weight:600;background:var(--bg);color:var(--t)}
h1{font-size:26px;font-weight:800;margin:8px 0 4px}
.card{background:var(--c);border:1px solid var(--bd);border-radius:18px;padding:16px;margin:12px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
button{font:inherit;cursor:pointer;color:var(--t)}
.chip{padding:9px 15px;border:2px solid var(--bd);border-radius:22px;background:var(--c)}
.chip.on{background:var(--p);border-color:var(--p);color:#fff}
.go{width:100%;padding:15px;border:0;border-radius:14px;background:var(--p);color:#fff;font-size:18px;font-weight:800;margin-top:6px}
.go:disabled{opacity:.6}
.ar{font-family:Amiri,'Traditional Arabic',serif;direction:rtl;text-align:right;font-size:26px;line-height:2;font-weight:400}
.opt{display:block;width:100%;margin:8px 0;padding:13px;border:2px solid var(--bd);border-radius:14px;background:var(--c);text-align:left;font-size:17px}
.opt.ar{text-align:right;font-size:22px;line-height:1.9}
.opt.ok{border-color:var(--ok);background:rgba(47,158,110,.2)}
.opt.no{border-color:var(--no);background:rgba(217,69,107,.2)}
.sm{opacity:.75;font-size:14px}
.row{display:flex;gap:8px;align-items:center}
.row .opt{flex:1;margin:8px 0}
.spk{flex:none;width:52px;height:52px;border:2px solid var(--bd);border-radius:14px;background:var(--c);font-size:20px}
button:focus-visible{outline:3px solid var(--p);outline-offset:2px}
</style></head><body>
<div id="app"></div>
<script>
// Daftar surat nomor 58-114: [nama, jumlah ayat]
const S=[["Al-Mujadilah",22],["Al-Hasyr",24],["Al-Mumtahanah",13],["Ash-Shaff",14],["Al-Jumu'ah",11],["Al-Munafiqun",11],["At-Taghabun",18],["At-Talaq",12],["At-Tahrim",12],["Al-Mulk",30],["Al-Qalam",52],["Al-Haqqah",52],["Al-Ma'arij",44],["Nuh",28],["Al-Jinn",28],["Al-Muzzammil",20],["Al-Muddatsir",56],["Al-Qiyamah",40],["Al-Insan",31],["Al-Mursalat",50],["An-Naba'",40],["An-Nazi'at",46],["'Abasa",42],["At-Takwir",29],["Al-Infithar",19],["Al-Muthaffifin",36],["Al-Insyiqaq",25],["Al-Buruj",22],["Ath-Thariq",17],["Al-A'la",19],["Al-Ghasyiyah",26],["Al-Fajr",30],["Al-Balad",20],["Asy-Syams",15],["Al-Lail",21],["Adh-Dhuha",11],["Al-Insyirah",8],["At-Tin",8],["Al-'Alaq",19],["Al-Qadr",5],["Al-Bayyinah",8],["Az-Zalzalah",8],["Al-'Adiyat",11],["Al-Qari'ah",11],["At-Takatsur",8],["Al-'Ashr",3],["Al-Humazah",9],["Al-Fil",5],["Quraisy",4],["Al-Ma'un",7],["Al-Kautsar",3],["Al-Kafirun",6],["An-Nasr",3],["Al-Lahab",5],["Al-Ikhlas",4],["Al-Falaq",5],["An-Nas",6]];
const nm=n=>S[n-58][0], cnt=n=>S[n-58][1];
const JZ={30:[78,114],29:[67,77],28:[58,66]};
const TY={urutan:"Urutan surat",sambung:"Sambung surat",lanjut:"Lanjut ayat",audio:"Soal audio"};
const R=Array.from({length:57},(_,i)=>58+i);
const $=id=>document.getElementById(id);
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const shuf=a=>a.map(x=>[Math.random(),x]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
const pad=n=>String(n).padStart(3,"0");
const bare=s=>s.replace(/[\u064B-\u065F\u0670\u06D6-\u06ED\u0640]/g,"");
let juz=new Set([30]),types=new Set(Object.keys(TY)),T={},Q=[],qi=0,score=0;
const au=new Audio();

function play(s,a){au.src=`https://everyayah.com/data/Alafasy_128kbps/${pad(s)}${pad(a)}.mp3`;au.play().catch(()=>{})}
const sel=()=>[...juz].flatMap(j=>{const[a,b]=JZ[j];return R.filter(x=>x>=a&&x<=b)});

async function load(n){
  if(T[n])return;
  let c;try{c=localStorage.getItem("q"+n)}catch(e){}
  if(c){T[n]=JSON.parse(c);return}
  const r=await fetch(`https://api.alquran.cloud/v1/surah/${n}/quran-uthmani`);
  const d=await r.json();
  // Buang basmalah yang ikut menempel di ayat pertama
  T[n]=d.data.ayahs.map((x,i)=>{
    const w=x.text.trim().split(" ");
    return i==0&&bare(w[0])=="بسم"?w.slice(4).join(" "):x.text.trim();
  });
  try{localStorage.setItem("q"+n,JSON.stringify(T[n]))}catch(e){}
}
async function loadAll(ns){
  const q=[...ns];
  await Promise.all(Array.from({length:5},async()=>{while(q.length)await load(q.shift())}));
}

function mk(ty,sl){
  const s=rnd(sl),n=cnt(s);
  if(ty=="urutan"){
    let d=rnd([1,-1]),t=s+d;
    if(t<58||t>114){d=-d;t=s+d}
    const P=sl.length>6?sl:R,w=shuf(P.filter(x=>x!=t&&x!=s)).slice(0,3);
    return{q:`Surat <b>${d>0?"setelah":"sebelum"}</b> ${nm(s)} adalah…`,o:shuf([t,...w]).map(x=>({t:nm(x),ok:x==t})),ex:`${nm(t)} (surat ke-${t})`};
  }
  if(ty=="sambung"){
    const t=s+1;if(t>114)return mk(ty,sl);
    const w=shuf(Object.keys(T).map(Number).filter(x=>x!=t)).slice(0,3);
    return{q:`Ayat terakhir surat <b>${nm(s)}</b>:<div class="ar">${T[s][n-1]}</div>Surat berikutnya dimulai dengan…`,qa:[s,n],
      o:shuf([t,...w]).map(x=>({t:T[x][0],ok:x==t,ar:1,a:[x,1]})),ex:`Surat berikutnya: ${nm(t)}`,a:[t,1]};
  }
  if(ty=="audio"&&Math.random()<.4){
    const k=1+Math.floor(Math.random()*n),w=shuf(sl.filter(x=>x!=s)).slice(0,3);
    return{q:"Dengarkan ayat ini. Dari surat apa?",pa:[s,k],o:shuf([s,...w]).map(x=>({t:nm(x),ok:x==s})),ex:`${nm(s)} ayat ${k}`,a:[s,k]};
  }
  // lanjut ayat (di tengah surat) atau versi audio-nya
  if(n<2)return mk(ty,sl);
  const k=1+Math.floor(Math.random()*(n-1)),isA=ty=="audio";
  const w=shuf(T[s].map((_,i)=>i+1).filter(i=>i!=k&&i!=k+1)).slice(0,3).map(i=>({t:T[s][i-1],ok:0,ar:1,a:[s,i]}));
  while(w.length<3){const r=+rnd(Object.keys(T)),i=Math.floor(Math.random()*T[r].length),x=T[r][i];if(x!=T[s][k]&&!w.some(v=>v.t==x))w.push({t:x,ok:0,ar:1,a:[r,i+1]})}
  const o=shuf([{t:T[s][k],ok:1,ar:1,a:[s,k+1]},...w]);
  return isA?{q:"Dengarkan ayat ini. Apa lanjutannya?",pa:[s,k],o,ex:`${nm(s)} ayat ${k+1}`,a:[s,k+1]}
    :{q:`Surat <b>${nm(s)}</b> ayat ${k}:<div class="ar">${T[s][k-1]}</div>Lanjutannya…`,qa:[s,k],o,ex:`${nm(s)} ayat ${k+1}`,a:[s,k+1]};
}

function home(msg){
  $("app").innerHTML=`<h1>Kuis Hafalan</h1><div class="sm">Latihan urutan surat dan sambung ayat</div>
  <div class="card"><b>Juz</b><div class="chips">${Object.keys(JZ).sort().reverse().map(j=>`<button class="chip ${juz.has(+j)?"on":""}" data-j="${j}">Juz ${j}</button>`).join("")}</div></div>
  <div class="card"><b>Jenis soal</b><div class="chips">${Object.entries(TY).map(([k,v])=>`<button class="chip ${types.has(k)?"on":""}" data-t="${k}">${v}</button>`).join("")}</div></div>
  <div class="sm">${msg||"Suara: Syekh Mishary Alafasy. Butuh internet."}</div>
  <button class="go" id="go">Mulai (10 soal)</button>`;
  document.querySelectorAll("[data-j]").forEach(b=>b.onclick=()=>{const j=+b.dataset.j;juz.has(j)?juz.delete(j):juz.add(j);home()});
  document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{const t=b.dataset.t;types.has(t)?types.delete(t):types.add(t);home()});
  $("go").onclick=start;
}

async function start(){
  const sl=sel();
  if(!sl.length||!types.size)return home("Pilih minimal satu juz dan satu jenis soal.");
  $("go").textContent="Memuat ayat…";$("go").disabled=true;
  try{await loadAll(new Set([...sl,...sl.map(x=>x+1).filter(x=>x<=114)]))}
  catch(e){return home("Gagal memuat ayat. Periksa internet, lalu coba lagi.")}
  Q=Array.from({length:10},()=>mk(rnd([...types]),sl));qi=0;score=0;show();
}

function show(){
  const q=Q[qi];
  $("app").innerHTML=`<div class="sm">Soal ${qi+1} dari ${Q.length} · Skor ${score}</div>
  <div class="card">${q.q}${q.pa||q.qa?`<div><button class="chip" id="pq">🔊 Putar ayat</button></div>`:""}</div>
  <div id="os">${q.o.map((o,i)=>`<div class="row"><button class="opt ${o.ar?"ar":""}" data-i="${i}">${o.t}</button>${o.a?`<button class="spk" data-p="${i}" aria-label="Dengar pilihan">🔊</button>`:""}</div>`).join("")}</div><div id="fb"></div>`;
  if(q.pa||q.qa){$("pq").onclick=()=>play(...(q.pa||q.qa));if(q.pa)play(...q.pa)}
  document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>play(...q.o[+b.dataset.p].a));
  document.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>answer(+b.dataset.i));
}

function answer(i){
  const q=Q[qi],bs=[...document.querySelectorAll("[data-i]")],ok=q.o[i].ok;
  bs.forEach((b,j)=>{b.disabled=true;if(q.o[j].ok)b.classList.add("ok");else if(j==i)b.classList.add("no")});
  if(ok)score++;
  if(q.a)play(...q.a);
  $("fb").innerHTML=`<div class="card">${ok?"✅ Benar!":"❌ Belum tepat."} ${q.ex}${q.a?`<div><button class="chip" id="rp">🔊 Dengar lagi</button></div>`:""}</div>
  <button class="go" id="nx">${qi==Q.length-1?"Lihat hasil":"Lanjut"}</button>`;
  if(q.a)$("rp").onclick=()=>play(...q.a);
  $("nx").onclick=()=>{au.pause();++qi<Q.length?show():end()};
}

function end(){
  const m=score>=9?"Masya Allah, hebat sekali!":score>=6?"Bagus! Terus diulang ya.":"Tidak apa-apa, ulangi lagi pelan-pelan.";
  $("app").innerHTML=`<h1>Skor ${score}/${Q.length}</h1><div class="card">${m}</div>
  <button class="go" id="again">Main lagi</button><button class="go" id="hm" style="background:var(--c);color:var(--t);border:2px solid var(--bd)">Ubah pilihan</button>`;
  $("again").onclick=start;$("hm").onclick=()=>home();
}
home();
</script></body></html>
