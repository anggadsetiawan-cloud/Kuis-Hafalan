<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kuis Hafalan</title>
<meta name="theme-color" content="#4f46e5">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Amiri&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f7f5;--c:#fff;--c2:#efefec;--t:#1a1a1a;--t2:#66665f;--p:#4f46e5;--pt:#fff;--ok:#1f7a54;--okt:#1f7a54;--no:#c2395a;--warn:#f5b83d;--bd:#e6e6e1;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root:not([data-theme]){--bg:#121212;--c:#1c1c1c;--c2:#262626;--t:#f2f2ef;--t2:#a6a6a0;--p:#818cf8;--pt:#111127;--ok:#23855c;--okt:#4fd19a;--no:#e5617f;--bd:#2f2f2e}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#121212;--c:#1c1c1c;--c2:#262626;--t:#f2f2ef;--t2:#a6a6a0;--p:#818cf8;--pt:#111127;--ok:#23855c;--okt:#4fd19a;--no:#e5617f;--bd:#2f2f2e}
:root[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box}
body{margin:0 auto;max-width:560px;padding:16px 16px 96px;font-family:"Plus Jakarta Sans",system-ui,sans-serif;font-weight:400;font-size:15px;line-height:1.5;background:var(--bg);color:var(--t)}
b{font-weight:600}
h1{font-size:24px;font-weight:600;letter-spacing:-.01em;margin:8px 0 4px}
.card{background:var(--c);border:1px solid var(--bd);border-radius:16px;padding:16px;margin:12px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
button{font:inherit;cursor:pointer;color:var(--t)}
.chip{min-height:44px;padding:9px 14px;border:1px solid var(--bd);border-radius:12px;background:var(--c);font-weight:500}
.chip.on{background:var(--p);border-color:var(--p);color:var(--pt)}
.chip:disabled{opacity:.45;cursor:not-allowed}
.seg{display:flex;gap:2px;padding:3px;margin-top:8px;background:var(--c2);border-radius:12px}
.seg .chip{flex:1;min-height:40px;padding:6px 8px;border:0;border-radius:10px;background:none;font-size:14px;color:var(--t2)}
.seg .chip.on{background:var(--c);color:var(--t);font-weight:600;box-shadow:0 0 0 1px var(--bd)}
.go{width:100%;min-height:48px;padding:12px;border:0;border-radius:12px;background:var(--p);color:var(--pt);font-size:16px;font-weight:600;margin-top:8px}
.go:disabled{opacity:.5}
.ar{font-family:Amiri,'Traditional Arabic',serif;direction:rtl;text-align:right;font-size:26px;line-height:2;font-weight:400}
.opt{display:block;width:100%;margin:8px 0;padding:13px;border:1px solid var(--bd);border-radius:12px;background:var(--c);text-align:left;font-size:16px}
.opt.ar{text-align:right;font-size:22px;line-height:1.9}
.opt.ok{border-color:var(--ok);background:rgba(31,122,84,.16)}
.opt.no{border-color:var(--no);background:rgba(194,57,90,.14)}
.sm{color:var(--t2);font-size:13px}
.sel{width:100%;margin-top:8px;padding:12px;border:1px solid var(--bd);border-radius:12px;background:var(--c);color:var(--t);font:inherit;font-size:16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.fin{min-height:40px;padding:6px 16px;border:1px solid var(--no);border-radius:12px;background:var(--c);color:var(--no);font-weight:600}
.row{display:flex;gap:8px;align-items:center}
.row .opt{flex:1;margin:8px 0}
.spk{flex:none;width:52px;height:52px;border:1px solid var(--bd);border-radius:12px;background:var(--c);display:flex;align-items:center;justify-content:center}
.hd{display:flex;align-items:center;gap:4px;margin:-4px 0 4px}
.gh{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 4px;border:0;background:none;font-weight:600}
.ib{width:44px;height:44px;border:0;border-radius:12px;background:none;display:flex;align-items:center;justify-content:center;color:var(--t2)}
.sp{flex:1}
.th{display:flex;align-items:center;gap:10px}
.tile{width:36px;height:36px;border-radius:10px;background:var(--c2);display:flex;align-items:center;justify-content:center;color:var(--p)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:12px 0}
.slot{min-height:58px;border:1px dashed var(--bd);border-radius:12px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:2px;padding:6px 10px;background:var(--c)}
.slot b{color:var(--t2);font-size:12px}
.slot span{font-weight:600}
.slot.ok{border:1px solid var(--ok);background:var(--ok);color:#fff}
.slot.ok b{color:#fff}
.slot.yel{border:1px solid var(--warn);background:var(--warn);color:#3a2a00}
.slot.yel b{color:#3a2a00}
.slot.bad{border:1px solid var(--no);background:var(--no);color:#fff;animation:sh .3s}
.slot.bad b{color:#fff}
.slot.hot{border-color:var(--p);background:rgba(79,70,229,.12)}
.pool{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom));z-index:5;display:flex;flex-wrap:wrap;gap:8px;padding:12px;border:1px solid var(--bd);border-radius:16px;background:var(--c);max-height:36vh;overflow:auto}
.blk{padding:9px 13px;border-radius:12px;background:var(--p);color:var(--pt);font-weight:600;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:grab}
.blk.on{outline:3px solid var(--c);box-shadow:0 0 0 6px rgba(79,70,229,.5)}
.blk.bad{background:var(--no);color:#fff}
.ghost{position:fixed;z-index:50;pointer-events:none;opacity:.92;transform:translate(-50%,-130%)}
.ov{position:fixed;inset:0;background:rgba(10,10,10,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:60}
.pop{background:var(--c);border-radius:20px;padding:24px;max-width:380px;width:100%;text-align:center}
@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.hint{animation:pl .8s infinite}
.slot.hint{border:1px solid var(--warn)}
@keyframes pl{50%{box-shadow:0 0 0 6px rgba(245,184,61,.6)}}
button:focus-visible{outline:3px solid var(--p);outline-offset:2px}
@keyframes vpop{0%{transform:scale(.88)}60%{transform:scale(1.07)}100%{transform:scale(1)}}
.vpop{animation:vpop .5s ease-out;transform-origin:50% 90%}
@media (prefers-reduced-motion:reduce){.vpop{animation:none}}
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;background:var(--c);border-top:1px solid var(--bd);padding:4px 6px calc(4px + env(safe-area-inset-bottom))}
.tb{flex:1;min-height:56px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:500;color:var(--t2)}
.tb.on{color:var(--p);font-weight:600}
.toast{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom));max-width:536px;margin:0 auto;z-index:45;background:var(--t);color:var(--bg);padding:6px 8px 6px 16px;border-radius:12px;display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:500}
.toast button{background:none;border:0;color:inherit;text-decoration:underline;font-weight:600;min-height:44px;padding:0 10px}
.vs .row svg{width:96px;height:96px}
.rw{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.rk{border-top:1px solid var(--bd);padding:6px 0}
.rk:first-child{border-top:0}
.rk.me{background:var(--c2);border-radius:10px;padding:6px 8px;margin:2px -8px}
.rkn{width:28px;text-align:center;color:var(--t2);font-weight:600}
.rkt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style></head><body>
<div id="nav"></div>
<div id="app"></div>
<div id="tabs"></div>
<script>
// Surat 1-114: nama|jumlah ayat
const SS="Al-Fatihah|7;Al-Baqarah|286;Ali 'Imran|200;An-Nisa'|176;Al-Ma'idah|120;Al-An'am|165;Al-A'raf|206;Al-Anfal|75;At-Taubah|129;Yunus|109;Hud|123;Yusuf|111;Ar-Ra'd|43;Ibrahim|52;Al-Hijr|99;An-Nahl|128;Al-Isra'|111;Al-Kahfi|110;Maryam|98;Thaha|135;Al-Anbiya'|112;Al-Hajj|78;Al-Mu'minun|118;An-Nur|64;Al-Furqan|77;Asy-Syu'ara'|227;An-Naml|93;Al-Qashash|88;Al-'Ankabut|69;Ar-Rum|60;Luqman|34;As-Sajdah|30;Al-Ahzab|73;Saba'|54;Fathir|45;Yasin|83;Ash-Shaffat|182;Shad|88;Az-Zumar|75;Ghafir|85;Fushshilat|54;Asy-Syura|53;Az-Zukhruf|89;Ad-Dukhan|59;Al-Jatsiyah|37;Al-Ahqaf|35;Muhammad|38;Al-Fath|29;Al-Hujurat|18;Qaf|45;Adz-Dzariyat|60;Ath-Thur|49;An-Najm|62;Al-Qamar|55;Ar-Rahman|78;Al-Waqi'ah|96;Al-Hadid|29;Al-Mujadilah|22;Al-Hasyr|24;Al-Mumtahanah|13;Ash-Shaff|14;Al-Jumu'ah|11;Al-Munafiqun|11;At-Taghabun|18;At-Talaq|12;At-Tahrim|12;Al-Mulk|30;Al-Qalam|52;Al-Haqqah|52;Al-Ma'arij|44;Nuh|28;Al-Jinn|28;Al-Muzzammil|20;Al-Muddatsir|56;Al-Qiyamah|40;Al-Insan|31;Al-Mursalat|50;An-Naba'|40;An-Nazi'at|46;'Abasa|42;At-Takwir|29;Al-Infithar|19;Al-Muthaffifin|36;Al-Insyiqaq|25;Al-Buruj|22;Ath-Thariq|17;Al-A'la|19;Al-Ghasyiyah|26;Al-Fajr|30;Al-Balad|20;Asy-Syams|15;Al-Lail|21;Adh-Dhuha|11;Al-Insyirah|8;At-Tin|8;Al-'Alaq|19;Al-Qadr|5;Al-Bayyinah|8;Az-Zalzalah|8;Al-'Adiyat|11;Al-Qari'ah|11;At-Takatsur|8;Al-'Ashr|3;Al-Humazah|9;Al-Fil|5;Quraisy|4;Al-Ma'un|7;Al-Kautsar|3;Al-Kafirun|6;An-Nasr|3;Al-Lahab|5;Al-Ikhlas|4;Al-Falaq|5;An-Nas|6";
const S=SS.split(";").map(x=>{const[a,b]=x.split("|");return[a,+b]});
const nm=n=>S[n-1][0],cnt=n=>S[n-1][1];
// Awal tiap juz [surat, ayat]
const JU=[[1,1],[2,142],[2,253],[3,93],[4,24],[4,148],[5,82],[6,111],[7,88],[8,41],[9,93],[11,6],[12,53],[15,1],[17,1],[18,75],[21,1],[23,1],[25,21],[27,56],[29,46],[33,31],[36,28],[39,32],[41,47],[46,1],[51,31],[58,1],[67,1],[78,1]];
const TY={urutan:"Urutan surat",sambung:"Sambung surat",lanjut:"Lanjut ayat",audio:"Soal audio"};
const MD=[["juz","Per juz"],["surat","Per surat"],["rjuz","Rentang juz"],["rsurat","Rentang surat"]];
const R=Array.from({length:114},(_,i)=>i+1);
const $=id=>document.getElementById(id);
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const shuf=a=>a.map(x=>[Math.random(),x]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
const pad=n=>String(n).padStart(3,"0");
const bare=s=>s.replace(/[\u064B-\u065F\u0670\u06D6-\u06ED\u0640]/g,"");
const pick=(xs,key,ban)=>{const seen=new Set([ban]),o=[];for(const x of xs){const k=key(x);if(!seen.has(k)){seen.add(k);o.push(x);if(o.length==3)break}}return o};
let types=new Set(Object.keys(TY)),T={},ans=0,score=0,mode="juz",P={juz:[30,30],surat:[78,78]},B={},SL=[],cur=null;
const au=new Audio();
const kind=()=>mode.endsWith("juz")?"juz":"surat",rng=()=>mode[0]=="r";

function play(s,a){au.src=`https://everyayah.com/data/Alafasy_128kbps/${pad(s)}${pad(a)}.mp3`;au.play().catch(()=>{})}

// Pilihan -> {nomor surat: [ayat awal, ayat akhir]}
function selB(){
  const k=kind();let[a,b]=P[k];if(!rng())b=a;if(a>b)[a,b]=[b,a];
  const o={},add=(s,l,h)=>{o[s]=o[s]?[Math.min(o[s][0],l),Math.max(o[s][1],h)]:[l,h]};
  if(k=="surat"){for(let s=a;s<=b;s++)add(s,1,cnt(s))}
  else for(let j=a;j<=b;j++){
    const[ss,sa]=JU[j-1];let es,ea;
    if(j<30){[es,ea]=JU[j];if(ea==1){es--;ea=cnt(es)}else ea--}else{es=114;ea=6}
    for(let s=ss;s<=es;s++)add(s,s==ss?sa:1,s==es?ea:cnt(s));
  }
  return o;
}

const fix=(n,ay)=>ay.map((x,i)=>{const w=x.text.trim().split(" ");return i==0&&n!=1&&bare(w[0])=="بسم"?w.slice(4).join(" "):x.text.trim()});
const save=n=>{try{localStorage.setItem("q"+n,JSON.stringify(T[n]))}catch(e){}};
async function loadAll(ns){
  const q=[...ns].filter(n=>{if(T[n])return false;try{const c=localStorage.getItem("q"+n);if(c){T[n]=JSON.parse(c);return false}}catch(e){}return true});
  if(q.length>20){
    const d=await(await fetch("https://api.alquran.cloud/v1/quran/quran-uthmani")).json();
    d.data.surahs.forEach(su=>{T[su.number]=fix(su.number,su.ayahs);save(su.number)});
    return;
  }
  await Promise.all(Array.from({length:5},async()=>{
    while(q.length){const n=q.shift();const d=await(await fetch(`https://api.alquran.cloud/v1/surah/${n}/quran-uthmani`)).json();T[n]=fix(n,d.data.ayahs);save(n)}
  }));
}

function mk(ty,sl){
  const s=rnd(sl),n=cnt(s),[lo,hi]=B[s];
  if(ty=="urutan"){
    let d=rnd([1,-1]),t=s+d;
    if(t<1||t>114){d=-d;t=s+d}
    const P2=sl.length>6?sl:R,w=shuf(P2.filter(x=>x!=t&&x!=s)).slice(0,3);
    return{q:`Surat <b>${d>0?"setelah":"sebelum"}</b> ${nm(s)} adalah…`,o:shuf([t,...w]).map(x=>({t:nm(x),ok:x==t})),ex:`${nm(t)} (surat ke-${t})`};
  }
  if(ty=="sambung"){
    const E=sl.filter(x=>x<114&&B[x][1]==cnt(x)&&B[x+1]&&B[x+1][0]==1);
    if(!E.length)return mk("lanjut",sl);
    const f=rnd(E),t=f+1,w=pick(shuf(Object.keys(T).map(Number).filter(x=>x!=t)),x=>T[x][0],T[t][0]);
    return{q:`Ayat terakhir surat <b>${nm(f)}</b>:<div class="ar">${T[f][cnt(f)-1]}</div>Surat berikutnya dimulai dengan…`,qa:[f,cnt(f)],
      o:shuf([t,...w]).map(x=>({t:T[x][0],ok:x==t,ar:1,a:[x,1]})),ex:`Surat berikutnya: ${nm(t)}`,a:[t,1]};
  }
  if(ty=="audio"&&Math.random()<.4){
    const k=lo+Math.floor(Math.random()*(hi-lo+1));
    if(sl.length==1){const v=shuf(Array.from({length:n},(_,i)=>i+1).filter(x=>x!=k)).slice(0,3);
      return{q:`Dengarkan ayat ini. Surat ${nm(s)} ayat ke berapa?`,pa:[s,k],o:shuf([k,...v]).map(x=>({t:"Ayat "+x,ok:x==k})),ex:`${nm(s)} ayat ${k}`,a:[s,k]}}
    const w=shuf((sl.length>6?sl:R).filter(x=>x!=s)).slice(0,3);
    return{q:"Dengarkan ayat ini. Dari surat apa?",pa:[s,k],o:shuf([s,...w]).map(x=>({t:nm(x),ok:x==s})),ex:`${nm(s)} ayat ${k}`,a:[s,k]};
  }
  // lanjut ayat (tengah surat) atau versi audionya
  if(hi<=lo)return mk(ty,sl);
  const k=lo+Math.floor(Math.random()*(hi-lo)),isA=ty=="audio",cor=T[s][k];
  const cand=T[s].map((x,i)=>[s,i+1,x]).filter(c=>c[1]!=k&&c[1]!=k+1);
  const w=pick(shuf(cand),c=>c[2],cor).map(c=>({t:c[2],ok:0,ar:1,a:[c[0],c[1]]}));
  for(let g=0;w.length<3&&g<80;g++){const r=+rnd(Object.keys(T)),i=Math.floor(Math.random()*T[r].length),x=T[r][i];if(x!=cor&&!w.some(v=>v.t==x))w.push({t:x,ok:0,ar:1,a:[r,i+1]})}
  const o=shuf([{t:cor,ok:1,ar:1,a:[s,k+1]},...w]);
  return isA?{q:"Dengarkan ayat ini. Apa lanjutannya?",pa:[s,k],o,ex:`${nm(s)} ayat ${k+1}`,a:[s,k+1]}
    :{q:`Surat <b>${nm(s)}</b> ayat ${k}:<div class="ar">${T[s][k-1]}</div>Lanjutannya…`,qa:[s,k],o,ex:`${nm(s)} ayat ${k+1}`,a:[s,k+1]};
}

function home(msg){
  const k=kind(),r=rng(),max=k=="juz"?30:114,[a,b]=P[k];
  const op=v=>R.slice(0,max).map(i=>`<option value="${i}" ${i==v?"selected":""}>${k=="juz"?"Juz "+i:i+". "+nm(i)}</option>`).join("");
  const pilih=r?`<div class="sm" style="margin-top:10px">Dari</div><select id="s1" class="sel">${op(a)}</select><div class="sm" style="margin-top:10px">Sampai</div><select id="s2" class="sel">${op(b)}</select><div class="chips"><button class="chip" id="all">Pilih semua</button></div>`
    :`<select id="s1" class="sel">${op(a)}</select>`;
  $("app").innerHTML=`<h1>Latihan</h1>${latSeg("kuis")}<div class="sm" style="margin-top:8px">Latihan urutan surat dan sambung ayat</div>
  <div class="card"><b>Mode</b><div class="chips">${MD.map(([m,l])=>`<button class="chip ${mode==m?"on":""}" data-m="${m}">${l}</button>`).join("")}</div>${pilih}</div>
  <div class="card"><b>Jenis soal</b><div class="chips">${Object.entries(TY).map(([k2,v])=>`<button class="chip ${types.has(k2)?"on":""}" data-t="${k2}">${v}</button>`).join("")}</div></div>
  <div class="sm">${msg||"Soal tanpa batas, tekan Selesai kapan saja. Suara: Syekh Mishary Alafasy. Butuh internet."}</div>
  <button class="chip" id="lnk">Salin link pilihan</button><button class="go" id="go">Mulai</button>`;
  document.querySelectorAll("[data-m]").forEach(x=>x.onclick=()=>{mode=x.dataset.m;home()});
  document.querySelectorAll("[data-t]").forEach(x=>x.onclick=()=>{const t=x.dataset.t;types.has(t)?types.delete(t):types.add(t);home()});
  $("s1").onchange=e=>{P[k][0]=+e.target.value;if(!r)P[k][1]=P[k][0]};
  if(r){$("s2").onchange=e=>{P[k][1]=+e.target.value};$("all").onclick=()=>{P[k]=[1,max];home()}}
  $("go").onclick=start;$("lnk").onclick=shareLink;
}

async function start(){
  if(!types.size)return home("Pilih minimal satu jenis soal.");
  B=selB();SL=Object.keys(B).map(Number);
  $("go").textContent="Memuat ayat…";$("go").disabled=true;
  const ex=SL.length<6?SL.flatMap(s=>[s-2,s-1,s+2,s+3]):[];
  try{await loadAll(new Set([...SL,...SL.map(x=>x+1),...ex].filter(x=>x>=1&&x<=114)))}
  catch(e){return home("Gagal memuat ayat. Periksa internet, lalu coba lagi.")}
  ans=0;score=0;seen.clear();next();
}

const seen=new Set(),kk=q=>q.q+"|"+(q.pa||q.qa||[]).join(",");
function next(){
  let q,g=0;
  do{q=mk(rnd([...types]),SL);g++}while(seen.has(kk(q))&&g<60);
  if(seen.has(kk(q)))seen.clear(); // semua soal sudah terpakai, mulai putaran baru
  seen.add(kk(q));cur=q;show();
}

function show(){
  const q=cur;
  $("app").innerHTML=`<div class="top"><span class="sm" id="st">Soal ${ans+1} · Benar ${score} dari ${ans}</span><button class="fin" id="fin">Selesai</button></div>
  <div class="card">${q.q}${q.pa||q.qa?`<div><button class="chip" id="pq">${I("vol",18)} Putar ayat</button></div>`:""}</div>
  <div id="os">${q.o.map((o,i)=>`<div class="row"><button class="opt ${o.ar?"ar":""}" data-i="${i}">${o.t}</button>${o.a?`<button class="spk" data-p="${i}" aria-label="Dengar pilihan">${I("vol",20)}</button>`:""}</div>`).join("")}</div><div id="fb"></div>`;
  if(q.pa||q.qa){$("pq").onclick=()=>play(...(q.pa||q.qa));if(q.pa)play(...q.pa)}
  document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>play(...q.o[+b.dataset.p].a));
  document.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>answer(+b.dataset.i));
  $("fin").onclick=end;
}

function answer(i){
  const q=cur,bs=[...document.querySelectorAll("[data-i]")],ok=q.o[i].ok;
  bs.forEach((b,j)=>{b.disabled=true;if(q.o[j].ok)b.classList.add("ok");else if(j==i)b.classList.add("no")});
  ans++;if(ok)score++;
  $("st").textContent=`Soal ${ans} · Benar ${score} dari ${ans}`;
  if(q.a)play(...q.a);
  $("fb").innerHTML=`<div class="card"><b style="color:${ok?"var(--okt)":"var(--no)"}">${ok?"Benar":"Belum tepat"}</b> ${q.ex}${q.a?`<div><button class="chip" id="rp">${I("vol",18)} Dengar lagi</button></div>`:""}</div>
  <button class="go" id="nx">Soal berikutnya</button>`;
  if(q.a)$("rp").onclick=()=>play(...q.a);
  $("nx").onclick=()=>{au.pause();next()};
}

function end(){
  au.pause();
  const p=ans?Math.round(score/ans*100):0;
  const m=!ans?"Belum ada soal yang dikerjakan.":p>=90?"Masya Allah, hebat sekali!":p>=60?"Bagus! Terus diulang ya.":"Tidak apa-apa, ulangi lagi pelan-pelan.";
  $("app").innerHTML=`<h1>${who?esc(who)+" · ":""}Nilai ${p}</h1><div class="card"><b>${score} benar dari ${ans} soal</b> yang dikerjakan.<br>${m}</div>${ans?`<div class="card" style="text-align:center"><p>${rnd(DOA)}</p><div class="ar" style="text-align:center;font-size:28px">رَبِّ زِدْنِي عِلْمًا</div><div class="sm">“Ya Rabbku, tambahkanlah ilmu kepadaku.”</div></div>`:""}
  <button class="go" id="again">Main lagi</button><button class="go" id="hm" style="background:var(--c);color:var(--t);border:2px solid var(--bd)">Ubah pilihan</button>`;
  $("again").onclick=start;$("hm").onclick=()=>home();
}

function snd(ok){
  if(muted){if(!ok&&navigator.vibrate)navigator.vibrate([80,40,80]);return}
  try{
    ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume();
    (ok?[[660,0],[880,.13]]:[[220,0],[160,.17]]).forEach(([f,t])=>{
      const o=ac.createOscillator(),g=ac.createGain();o.type=ok?"sine":"square";o.frequency.value=f;g.gain.value=.15;
      o.connect(g);g.connect(ac.destination);o.start(ac.currentTime+t);o.stop(ac.currentTime+t+.14);
    });
  }catch(e){}
  if(!ok&&navigator.vibrate)navigator.vibrate([80,40,80]);
}

  <div class="chips"><button class="chip ${hideNo?"on":""}" id="hn">Tanpa nomor surat (lebih sulit)</button><button class="chip ${hard?"on":""}" id="hd">Mode sulit: blok terus diacak</button><button class="chip" id="lnk">Salin link pilihan</button></div>

}

function susunStart(sub){
  const asc=(sub||Object.keys(selB()).map(Number)).slice().sort((a,b)=>a-b),d=dir=="auto"?rnd(["asc","desc"]):dir,L=d=="desc"?asc.reverse():asc;
  SU={L,pool:shuf(L),placed:{},flag:{},wrong:0,hints:0,wsince:0,selId:null,busy:{},t0:Date.now(),sig:sub?null:sigNow(),sub,hard};
  try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(e){}
  $("app").innerHTML=`<div class="top"><span class="sm" id="sst"></span><span><button class="chip" id="hint">💡 Petunjuk</button> <button class="fin" id="sback">Kembali</button></span></div>
  <div class="sm" style="margin-top:6px">Urutan: ${d=="asc"?"sesuai mushaf, dari atas ke bawah":"terbalik, surat paling belakang di atas"}. Petunjuk aktif setelah 3 kali salah berturut-turut. Hijau = slot langsung benar, kuning = slot pernah diisi blok salah atau dibantu petunjuk.${hard?" <b>Mode sulit:</b> blok yang sudah terpasang tetap ada di kumpulan dan posisinya diacak setiap tarikan.":""}</div>
  <div class="slots">${L.map((s,i)=>`<div class="slot" data-slot="${i}"><b>${hideNo?"Posisi "+(i+1):"Surah ke-"+s}</b><span></span></div>`).join("")}</div>
  <div class="pool">${SU.pool.map(s=>`<div class="blk" data-b="${s}">${nm(s)}</div>`).join("")}</div>`;
  stat();
  $("sback").onclick=susunHome;$("hint").onclick=hint;
  document.querySelectorAll(".slot").forEach(sl=>sl.onclick=()=>{if(SU.selId!=null)place(+sl.dataset.slot,SU.selId)});
  document.querySelectorAll(".blk").forEach(bindBlk);
  window.scrollTo(0,0);
}

const stat=()=>{
  $("sst").textContent=`Terpasang ${Object.keys(SU.placed).length} dari ${SU.L.length} · Salah ${SU.wrong}`;
  const h=$("hint");if(h){h.disabled=SU.wsince<3;h.style.opacity=h.disabled?.45:1}
};
function hint(){
  if(SU.wsince<3)return;
  const i=SU.L.findIndex((s,j)=>!SU.placed[j]);if(i<0)return;
  SU.hints++;SU.wsince=0;SU.flag[SU.L[i]]=1;stat();
  const sl=document.querySelector(`[data-slot="${i}"]`),b=document.querySelector(`[data-b="${SU.L[i]}"]`);
  if(b)b.scrollIntoView({block:"nearest"});
  sl.scrollIntoView({block:"center",behavior:"smooth"});
  [sl,b].forEach(e=>e&&e.classList.add("hint"));
  setTimeout(()=>[sl,b].forEach(e=>e&&e.classList.remove("hint")),3000);
}
const mark=()=>document.querySelectorAll(".blk").forEach(b=>b.classList.toggle("on",+b.dataset.b==SU.selId));

function hot(x,y){
  const t=document.elementFromPoint(x,y),sl=t&&t.closest?t.closest(".slot"):null;
  if(hotEl)hotEl.classList.remove("hot");
  hotEl=sl&&!sl.classList.contains("ok")?sl:null;
  if(hotEl)hotEl.classList.add("hot");
}

function bindBlk(el){
  el.oncontextmenu=e=>e.preventDefault();
  el.onpointerdown=e=>{
    if(e.button>0)return;
    e.preventDefault();
    const s=+el.dataset.b,x0=e.clientX,y0=e.clientY;let g=null,moved=false,tm=null;
    try{el.setPointerCapture(e.pointerId)}catch(_){}
    const clean=()=>{el.onpointermove=el.onpointerup=el.onpointercancel=null;clearInterval(tm);if(g)g.remove();el.style.opacity="";if(hotEl)hotEl.classList.remove("hot");hotEl=null};
    el.onpointermove=ev=>{
      if(!moved&&Math.hypot(ev.clientX-x0,ev.clientY-y0)<8)return;
      if(!moved){
        moved=true;g=el.cloneNode(true);g.className="blk ghost";document.body.appendChild(g);el.style.opacity=.35;
        tm=setInterval(()=>{if(g._y<90)scrollBy(0,-14);else if(g._y>innerHeight-30)scrollBy(0,14)},30);
      }
      g._y=ev.clientY;g.style.left=ev.clientX+"px";g.style.top=ev.clientY+"px";hot(ev.clientX,ev.clientY);
    };
    el.onpointerup=ev=>{
      const t=moved?document.elementFromPoint(ev.clientX,ev.clientY):null,sl=t&&t.closest?t.closest(".slot"):null;
      clean();
      if(moved){if(sl)place(+sl.dataset.slot,s)}
      else{SU.selId=SU.selId==s?null:s;mark()}
    };
    el.onpointercancel=clean;
  };
}

function reshuf(){const p=document.querySelector(".pool");if(!p)return;shuf([...p.children]).forEach(e=>p.appendChild(e))}
function place(i,s){
  if(SU.placed[i]||SU.busy[i]||!SU.pool.includes(s))return;
  place1(i,s);
  if(SU.hard){mark();reshuf()}
}
function place1(i,s){
  const sl=document.querySelector(`[data-slot="${i}"]`),b=document.querySelector(`[data-b="${s}"]`),sp=sl.querySelector("span");
  if(SU.L[i]==s){
    SU.placed[i]=1;SU.wsince=0;if(!SU.hard)SU.pool=SU.pool.filter(x=>x!=s);if(SU.selId==s)SU.selId=null;
    if(!SU.hard)b.remove();sl.classList.add("ok");if(SU.flag[s])sl.classList.add("yel");else{const w=wk();if(w[s]>0){w[s]--;wset(w)}}sp.textContent=nm(s);snd(true);stat();
    if(Object.keys(SU.placed).length>=SU.L.length)setTimeout(finish,700);
  }else{
    SU.wrong++;SU.wsince++;SU.busy[i]=1;SU.flag[SU.L[i]]=1;{const w=wk(),u=SU.L[i];w[u]=(w[u]||0)+1;wset(w)}
    sl.classList.add("bad");sp.textContent=nm(s);b.classList.add("bad");snd(false);stat();
    setTimeout(()=>{sl.classList.remove("bad");sp.textContent="";b.classList.remove("bad");SU.busy[i]=0},800);
  }
}

function finish(){
  const ky=Object.keys(SU.flag).length,t=Math.round((Date.now()-SU.t0)/1000),sc=SU.wrong+SU.hints,key="rek:"+who+":"+SU.sig;
  let p=null;try{p=JSON.parse(ls.get(key))}catch(e){}
  const baru=!p||sc<p.s||(sc==p.s&&t<p.t);
  if(baru&&who&&SU.sig)ls.set(key,JSON.stringify({s:sc,t}));
  const o=document.createElement("div");o.className="ov";
  o.innerHTML=`<div class="pop"><div style="font-size:48px">🎉</div><h1>Masya Allah${who?", "+esc(who):""}!</h1>
  <div>Semua ${SU.L.length} surat tersusun benar. Salah tarik: ${SU.wrong} · Petunjuk: ${SU.hints} · Waktu: ${fmt(t)}.</div>
  <div style="margin:6px 0">🟩 Hijau: ${SU.L.length-ky} · 🟨 Kuning: ${ky}</div>
  ${SU.sig?`<div class="sm" style="margin:6px 0">${baru?"🏆 Rekor baru!":"Rekor terbaikmu: "+p.s+" kesalahan, "+fmt(p.t)}</div>`:""}
  <p>${rnd(DOA)}</p><div class="ar" style="text-align:center;font-size:30px">رَبِّ زِدْنِي عِلْمًا</div><div class="sm">“Ya Rabbku, tambahkanlah ilmu kepadaku.”</div>
  ${ky>1?`<button class="go" id="again3" style="background:#f5b83d;color:#3a2a00">Latih surat kuning (${ky})</button>`:""}<button class="go" id="again2">Susun lagi</button><button class="go" id="back2" style="background:var(--c);color:var(--t);border:2px solid var(--bd)">Kembali</button></div>`;
  document.body.appendChild(o);
  $("again2").onclick=()=>{o.remove();susunStart(SU.sub)};if($("again3"))$("again3").onclick=()=>{o.remove();susunStart(Object.keys(SU.flag).map(Number))};$("back2").onclick=()=>{o.remove();susunHome()};
}

const HAL=604,BAR=15,AYH=6236/604,HR=["Ahad","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const dparse=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const dfmt=d=>d.toLocaleDateString("id-ID",{day:"numeric",month:"long",year:"numeric"});
const n2=x=>String(+x.toFixed(2)).replace(".",",");
const clamp=(v,a,b)=>Math.min(Math.max(isNaN(v)?a:v,a),b);
const tgKey=()=>"tgt:"+who;
const tgGet=()=>{try{return JSON.parse(ls.get(tgKey())||"null")}catch(e){return null}};
const tgDef=()=>({w:who,jz:0,hl:0,goal:30,mode:"dur",months:12,speed:1,start:iso(new Date()),rest:[]});
const haveOf=t=>t.jz>=30?HAL:Math.min(HAL,t.jz*20+t.hl);
const goalOf=t=>t.goal>=30?HAL:t.goal*20;
const bh=b=>{b=Math.round(b);const h=Math.floor(b/BAR),r=b%BAR;return((h?h+" halaman":"")+(h&&r?" ":"")+(r?r+" baris":""))||"0 baris"};
const amt=b=>`${bh(b)} <span class="sm">(≈ ${n2(b/BAR/20)} juz)</span>`;
let TG=null;

function tgPlan(t){
  const wd=7-t.rest.length,remB=Math.round((goalOf(t)-haveOf(t))*BAR);
  if(wd<1)return{err:"Pilih minimal satu hari aktif dalam sepekan."};
  if(remB<=0)return{done:1};
  const st=dparse(t.start);let perB,tgtDays=0,last=new Date(st);
  if(t.mode=="dur"){
    const end=new Date(st);end.setMonth(end.getMonth()+t.months);
    for(const d=new Date(st);d<end;d.setDate(d.getDate()+1))if(!t.rest.includes(d.getDay()))tgtDays++;
    if(tgtDays<1)return{err:"Durasi terlalu pendek untuk hari aktif yang dipilih."};
    perB=Math.max(1,Math.round(remB/tgtDays));
  }else perB=Math.max(1,Math.round(t.speed*BAR));
  const days=Math.ceil(remB/perB);
  for(let c=0;;last.setDate(last.getDate()+1))if(!t.rest.includes(last.getDay())&&++c==days)break;
  return{perB,remB,days,tgtDays,last,wd,weekB:perB*wd,monthB:perB*wd*30.44/7};
}

function tgHTML(t,p){
  if(p.err)return`<div style="color:var(--no)">${p.err}</div>`;
  if(p.done)return`<b>Masya Allah!</b><div class="sm">Hafalanmu sudah mencapai (atau melebihi) target ini. Pilih target yang lebih tinggi.</div>`;
  const ph=p.perB/BAR,w=ph>5?"Cukup berat (lebih dari 5 halaman per hari). Pertimbangkan durasi yang lebih panjang.":ph>2?"Target menantang, butuh waktu khusus tiap hari.":ph<0.25?"Sangat ringan; bisa dinaikkan kalau ingin lebih cepat.":"Target ini realistis untuk kebanyakan orang.";
  const sel=t.mode=="dur"&&p.days!=p.tgtDays?` Karena dibulatkan ke baris, selesai dalam ${p.days} hari aktif (target awal ${p.tgtDays}).`:"";
  return`<b>Rincian target</b>
  <div style="margin-top:8px">Sisa yang dihafal: <b>${bh(p.remB)}</b> <span class="sm">(≈ ${n2(p.remB/BAR/20)} juz)</span></div>
  <div>Selesai sekitar: <b>${dfmt(p.last)}</b> <span class="sm">(${p.days} hari aktif)</span></div>
  <div style="margin-top:8px">Per hari: <b>${bh(p.perB)}</b> <span class="sm">(±${Math.round(ph*AYH)} ayat)</span></div>
  <details style="margin-top:6px"><summary class="sm" style="cursor:pointer;padding:8px 0">Lihat per pekan dan per bulan</summary><div>Per pekan: ${amt(p.weekB)}</div><div style="margin-top:4px">Per bulan: ${amt(p.monthB)}</div></details>
  <div class="sm" style="margin-top:8px">${w}${sel} Baris dibulatkan (setengah baris ke atas). Ayat memakai rata-rata mushaf Madinah (604 halaman, 15 baris).</div>`;
}

function tgRead(){
  if(!$("tj"))return;
  TG.jz=clamp(parseInt($("tj").value),0,30);TG.hl=clamp(parseFloat($("th").value),0,HAL);
  TG.goal=+$("tg").value;

}

// ===== Murojaah harian (tahap 2) =====
const MJL={min:["Minimal","1 halaman",BAR],rin:["Ringan","1/4 juz",5*BAR],sed:["Sedang","1/2 juz",10*BAR],int:["Intensif","1 juz",20*BAR]};
const mjRec=hb=>{const j=hb/BAR/20;return j>=20?"int":j>=5?"sed":"rin"};
function mjCalc(t,hb){
  const k=t.mj&&t.mj!="rec"?t.mj:mjRec(hb),per=Math.min(MJL[k][2],hb);
  return{k,per,cyc:per>0?Math.ceil(hb/per):0};
}
const pkn=d=>d<14?d+" hari":d+" hari (±"+n2(d/7)+" pekan)";
function mjHTML(t){

  const sel=t.mj||"rec",c=mjCalc(t,hb),c2=mjCalc(t,gb);
  const ch=[["rec","Rekomendasi"]].concat(Object.keys(MJL).map(k=>[k,MJL[k][0]+" · "+MJL[k][1]])).map(([k,l])=>`<button class="chip ${sel==k?"on":""}" data-mj="${k}">${l}</button>`).join("");
  const dua=c.cyc>14?` Untuk satu putaran 2 pekan butuh ${bh(Math.ceil(hb/14))} per hari, terlalu berat bagi kebanyakan orang, jadi tingkat dibatasi maksimal 1 juz per hari.`:"";
  return`<div class="card"><b>Murojaah harian</b><div class="chips">${ch}</div>
  <div style="margin-top:10px">Per hari: <b>${bh(c.per)}</b> <span class="sm">(tingkat ${MJL[c.k][0].toLowerCase()}${sel=="rec"?", rekomendasi":""})</span></div>
  ${sholatHTML(c.per)}<div style="margin-top:8px">Satu putaran semua hafalan: <b>${pkn(c.cyc)}</b></div>
  ${gb>hb?`<div style="margin-top:8px" class="sm">Kalau hafalan sudah mencapai ${n2(gb/BAR/20)} juz: ±${bh(c2.per)} per hari, satu putaran ${pkn(c2.cyc)}.</div>`:""}
  <div class="sm" style="margin-top:8px">Murojaah setiap hari, tidak ikut hari libur ziyadah. Target dihitung dari hafalanmu saat ini dan ikut menyesuaikan setelah mutabaah aktif.${dua}</div></div>`;
}

// ===== Mutabaah harian (tahap 3) =====
const HS=["Ahd","Sen","Sel","Rab","Kam","Jum","Sab"],SH=["Shubuh","Dzuhur","Ashar","Maghrib","Isya"];
const mtGet=()=>{try{return JSON.parse(ls.get("mtb:"+who)||"{}")||{}}catch(e){return{}}};
const mtSet=o=>ls.set("mtb:"+who,JSON.stringify(o));
const mtNow=t=>{const L=mtGet();let z=0;for(const k in L)z+=L[k].z||0;return Math.min(HAL*BAR,Math.round(haveOf(t)*BAR)+z)};
const sholatSplit=b=>{const a=Array(5).fill(Math.floor(b/5)),ex=[0,3,4,2,1];for(let i=0;i<b%5;i++)a[ex[i]]++;return a};
const sholatHTML=b=>b<=0?"":`<div class="sm" style="margin-top:8px">Rekomendasi pembagian per shalat (boleh disesuaikan):</div><div style="display:grid;grid-template-columns:auto 1fr;gap:2px 14px;margin-top:4px">${sholatSplit(b).map((x,i)=>`<span class="sm">${SH[i]}</span><span>${x?bh(x):"—"}</span>`).join("")}</div>`;
let mtOff=0,mtOpen={m:false,z:false};

// Konteks satu hari: hafalan di awal hari itu, target murojaah & ziyadah, isian
function mtCtx(t,L,d,pl){
  pl=pl||tgPlan(t);const k=iso(d),base=Math.round(haveOf(t)*BAR),gb=Math.round(goalOf(t)*BAR);
  let z=0;for(const x in L)if(x<k)z+=L[x].z||0;
  const hb=Math.min(HAL*BAR,base+z),st=dparse(t.start);let zt=0,zn="";
  if(pl.err)zn="Atur ulang hari aktif di halaman Target";
  else if(pl.done||hb>=gb)zn="Target ziyadah sudah tercapai 🎉";
  else if(d<st)zn="Target ziyadah dimulai "+dfmt(st);
  else if(t.rest.includes(d.getDay()))zn="Hari libur ziyadah";
  else zt=Math.min(pl.perB,gb-hb);
  return{k,hb,mt:hb>0?mjCalc(t,hb).per:0,zt,zn,zc:Math.max(0,gb-hb),e:L[k]||{m:0,z:0}};
}
function mtStreak(t,L,pl){
  let n=0;const d=new Date();d.setHours(0,0,0,0);
  for(let i=0;i<400;i++,d.setDate(d.getDate()-1)){
    const c=mtCtx(t,L,d,pl);if(c.mt==0&&c.zt==0)continue;
    if(c.e.m>=c.mt&&c.e.z>=c.zt)n++;else if(i>0)break;
  }
  return n;
}
function mtCal(t,L,pl){
  const n=new Date(),y=n.getFullYear(),m=n.getMonth(),dim=new Date(y,m+1,0).getDate(),lead=new Date(y,m,1).getDay();
  let h=HS.map(x=>`<div class="sm" style="text-align:center">${x}</div>`).join("")+"<div></div>".repeat(lead);
  for(let i=1;i<=dim;i++){
    const d=new Date(y,m,i),c=mtCtx(t,L,d,pl),has=c.e.m>0||c.e.z>0,ok=(c.mt>0||c.zt>0)&&c.e.m>=c.mt&&c.e.z>=c.zt,fut=d>n;
    const bg=fut?"transparent":ok?"var(--ok)":has?"#f5b83d":"var(--bd)",fg=ok?"#fff":has?"#3a2a00":"var(--t)";
    h+=`<div style="text-align:center;min-height:42px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:8px;background:${bg};color:${fg};font-size:13px;font-weight:800;line-height:1.15;${fut?"opacity:.5":""}">${i}<span style="font-size:11px">${ok?"✓":has?"•":""}</span></div>`;
  }
  return`<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px">${h}</div>`;
}

function vsMap(p){
  const N=[[24,84],[90,58],[156,80],[222,44],[278,28]],q=Math.min(p,.9999)*4,i=Math.floor(q),f=q-i,[x0,y0]=N[i],[x1,y1]=N[i+1];

  const dots=N.map(([nx,ny],j)=>`<circle cx="${nx}" cy="${ny}" r="6" fill="${p>=j/4-1e-9?"#3fa34d":"#cfd6cf"}"/><text x="${nx}" y="${ny+21}" font-size="11" text-anchor="middle" fill="currentColor">${j*25}%</text>`).join("");
  return`<svg viewBox="0 0 300 115" width="100%" class="vpop" role="img" aria-label="Perjalanan ${Math.round(p*100)} persen"><path d="${path}" stroke="#c9a66b" stroke-width="4" stroke-dasharray="2 7" stroke-linecap="round" fill="none"/>${dots}<text x="278" y="14" font-size="18" text-anchor="middle">🏁</text><text x="${x.toFixed(1)}" y="${(y-9).toFixed(1)}" font-size="22" text-anchor="middle">🚶</text></svg>`;

function lcStats(t,L,pl){
  const keys=Object.keys(L).sort(),r={full:0,md:0,z:0,best:0,bon:0};if(!keys.length)return r;
  for(const x in L)r.z+=L[x].z||0;
  const d=dparse(keys[0]),end=new Date();end.setHours(0,0,0,0);let run=0;
  for(;d<=end;d.setDate(d.getDate()+1)){
    const c=mtCtx(t,L,d,pl);if(c.mt==0&&c.zt==0)continue;
    const ok=c.e.m>=c.mt&&c.e.z>=c.zt;
    if(c.mt>0&&c.e.m>=c.mt)r.md++;
    if((c.mt>0&&c.e.m>c.mt)||(c.zt>0&&c.e.z>c.zt))r.bon++;
    if(ok){r.full++;run++;r.best=Math.max(r.best,run)}else if(d<end)run=0;
  }
  return r;
}
const LC=[["🌱","Hari pertama lengkap",s=>s.full>=1],["🔥","3 hari beruntun",s=>s.best>=3],["🔥","7 hari beruntun",s=>s.best>=7],["🔥","14 hari beruntun",s=>s.best>=14],["🔥","30 hari beruntun",s=>s.best>=30],["📖","Murojaah 7 hari",s=>s.md>=7],["📖","Murojaah 30 hari",s=>s.md>=30],["🌳","Ziyadah 1 juz",s=>s.z>=20*BAR],["🌳","Ziyadah 5 juz",s=>s.z>=100*BAR],["⭐","Melebihi target",s=>s.bon>=1],["🏆","Target tercapai",(s,p)=>p>=1]];
function lcHTML(t,L,pl){

}

  <div class="card" style="display:flex;align-items:center;gap:16px">${ring(fr,nt?dd+"/"+nt:"—")}<div><div style="font-size:17px;font-weight:600">${ttl}</div><div class="sm">${sub}</div><div class="sm" style="margin-top:4px">Beruntun ${mtStreak(t,L,pl)} hari</div></div></div>

  document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{

  });

// Kontrak untuk server nanti: globalBoard() -> {top:[{rank,name,score,hidden,me}], me:{rank,score,streak,hidden}, total}
const NMD=["Aisyah","Fatimah","Maryam","Khadijah","Zainab","Hafshah","Salamah","Asma","Sumayyah","Ruqayyah","Safiyyah","Nusaibah","Hanifah","Salsabila","Najwa","Aqila","Zahra","Naila","Alya","Humaira"];
function mySkor(){
  const t=tgGet();if(!t)return{score:0,streak:0,total:0,week:0};
  const L=mtGet(),pl=tgPlan(t),d=new Date();d.setHours(0,0,0,0);let sc=0,wk=0;
  for(let i=0;i<30;i++){const x=new Date(d);x.setDate(x.getDate()-i);const c=mtCtx(t,L,x,pl);if((c.mt>0||c.zt>0)&&c.e.m>=c.mt&&c.e.z>=c.zt){sc++;if(i<7)wk++}}
  return{score:sc,streak:mtStreak(t,L,pl),total:lcStats(t,L,pl).full,week:wk};
}
const Api={
  demo:true,
  lag:v=>new Promise(r=>setTimeout(()=>r(v),150)),
  async globalBoard(){
    const me=mySkor(),share=ls.get("rk:share:"+who)=="1";
    const all=Array.from({length:40},(_,i)=>{const sc=Math.max(0,30-Math.floor(i*.75)-(i*7)%3);return{name:NMD[i%20]+(i>=20?" "+(i-18):""),score:sc,streak:Math.min(sc,(i*5)%12+1),total:sc*3+(i*13)%20,hidden:i%5==3}});
    all.push({name:who||"Kamu",score:me.score,streak:me.streak,total:me.total,hidden:!share,me:true});
    all.sort((a,b)=>b.score-a.score||b.streak-a.streak||b.total-a.total||(a.me?1:b.me?-1:0));
    all.forEach((x,i)=>x.rank=i+1);
    const m=all.find(x=>x.me);
    return this.lag({top:all.slice(0,10).map(x=>({rank:x.rank,name:x.name,score:x.score,hidden:x.hidden,me:!!x.me})),me:{rank:m.rank,score:m.score,streak:m.streak,hidden:m.hidden},total:all.length});
  }
};

// ===== Halaqah (mode contoh, data di HP sampai server aktif) =====
const hqKey=()=>"hq:"+who,hqSave=d=>ls.set(hqKey(),JSON.stringify(d));
const hqGen=(n,seed,own)=>Array.from({length:n},(_,i)=>{const sc=Math.max(0,30-i*3-(i*seed)%4),wk=Math.max(0,7-Math.floor(i*.9)-(i*seed)%2);return{id:"m"+seed+"_"+i,n:i==0&&own?own:NMD[(i*3+seed)%20],sc,wk,hid:i>0&&i%4==2,own:i==0&&!!own}});
function hqLoad(){
  let d=null;try{d=JSON.parse(ls.get(hqKey())||"null")}catch(e){}
  if(!d){d={n:1,groups:[{id:"g1",name:"Halaqah Contoh",code:"DEMO01",owner:"Ustazah Contoh",share:false,members:hqGen(8,1,"Ustazah Contoh")}],inbox:[{id:"i1",code:"DEMO42",name:"Halaqah Rabbani (contoh)",by:"Ustaz Contoh",count:12,seed:2}],blocked:[]};hqSave(d)}
  return d;
}
const hqSince=()=>{let s=ls.get("since:"+who);if(!s){s=iso(new Date());ls.set("since:"+who,s)}return s};
const hqCodeGen=()=>Array.from({length:6},()=>"ABCDEFGHJKLMNPQRSTUVWXYZ23456789"[Math.floor(Math.random()*32)]).join("");
function hqCan(d){
  const me=mySkor(),age=Math.floor((Date.now()-dparse(hqSince()).getTime())/864e5),skip=ls.get("demo:skip")=="1",owned=d.groups.filter(g=>g.owner=="me").length;
  const reasons=[{label:"Beruntun minimal 7 hari (kamu: "+me.streak+")",ok:skip||me.streak>=7},{label:"Akun minimal 7 hari (kamu: "+age+")",ok:skip||age>=7},{label:"Memiliki kurang dari 3 Halaqah (kamu: "+owned+")",ok:owned<3},{label:"Mengikuti kurang dari 5 Halaqah (kamu: "+d.groups.length+")",ok:d.groups.length<5}];
  return{ok:reasons.every(r=>r.ok),reasons,skip};
}
const hqF=async f=>{await Api.lag();return f()};
const hqG=(d,id)=>{const g=d.groups.find(x=>x.id==id);if(!g)throw Error("Halaqah tidak ditemukan");return g};
Object.assign(Api,{
  hqList:()=>hqF(()=>{const d=hqLoad(),c=hqCan(d);return{mine:d.groups.map(g=>({id:g.id,name:g.name,role:g.owner=="me"?"Ketua":"Anggota",count:g.members.length+1})),inbox:d.inbox.filter(i=>!d.blocked.includes(i.by)),canCreate:c,skip:c.skip}}),
  hqGet:(id,mode)=>hqF(()=>{
    const d=hqLoad(),g=hqG(d,id),me=mySkor(),mine=g.owner=="me";
    const all=g.members.map(m=>({id:m.id,name:m.n,score:m.sc,week:m.wk,hidden:m.hid,own:!!m.own}));
    all.push({id:"me",name:who||"Kamu",score:me.score,week:me.week,hidden:!g.share,me:true,own:mine});
    const k=mode=="30"?"score":"week",o=k=="week"?"score":"week";
    all.sort((a,b)=>b[k]-a[k]||b[o]-a[o]||(a.me?1:b.me?-1:0));all.forEach((x,i)=>x.rank=i+1);
    return{id:g.id,name:g.name,role:mine?"Ketua":"Anggota",code:g.code,share:g.share,count:all.length,members:all,goal:all.length*5,done:all.reduce((s,x)=>s+Math.min(5,x.week),0)};
  }),
  hqCreate:name=>hqF(()=>{const d=hqLoad();if(!hqCan(d).ok)throw Error("Syarat membuat Halaqah belum terpenuhi.");const g={id:"g"+(++d.n),name,code:hqCodeGen(),owner:"me",share:true,members:[]};d.groups.push(g);hqSave(d);return{id:g.id}}),
  hqPreview:code=>hqF(()=>{const d=hqLoad(),i=d.inbox.find(x=>x.code==code&&!d.blocked.includes(x.by)),g=d.groups.find(x=>x.code==code);return i?{id:i.id,name:i.name,by:i.by,count:i.count}:g?{already:true,name:g.name}:null}),
  hqAccept:id=>hqF(()=>{const d=hqLoad(),i=d.inbox.find(x=>x.id==id);if(!i)throw Error("Undangan sudah tidak berlaku.");if(d.groups.length>=5)throw Error("Batas Halaqah yang diikuti sudah 5.");d.groups.push({id:"g"+(++d.n),name:i.name,code:i.code,owner:i.by,share:false,members:hqGen(i.count-1,i.seed||3,i.by)});d.inbox=d.inbox.filter(x=>x.id!=id);hqSave(d)}),
  hqDecline:(id,block)=>hqF(()=>{const d=hqLoad(),i=d.inbox.find(x=>x.id==id);if(!i)return;if(block){d.blocked.push(i.by);d.inbox=d.inbox.filter(x=>x.by!=i.by)}else d.inbox=d.inbox.filter(x=>x.id!=id);hqSave(d)}),
  hqLeave:id=>hqF(()=>{const d=hqLoad(),g=hqG(d,id);if(g.owner=="me"&&g.members.length>0)throw Error("Serahkan kepemimpinan dulu sebelum keluar.");d.groups=d.groups.filter(x=>x.id!=id);hqSave(d)}),
  hqKick:(id,mid)=>hqF(()=>{const d=hqLoad(),g=hqG(d,id);g.members=g.members.filter(m=>m.id!=mid);hqSave(d)}),
  hqTransfer:(id,mid)=>hqF(()=>{const d=hqLoad(),g=hqG(d,id),t=g.members.find(m=>m.id==mid);if(!t)throw Error("Anggota tidak ditemukan");g.members.forEach(m=>m.own=m.id==mid);g.owner=t.n;hqSave(d)}),
  hqNewCode:id=>hqF(()=>{const d=hqLoad();hqG(d,id).code=hqCodeGen();hqSave(d)}),
  hqShare:(id,v)=>hqF(()=>{const d=hqLoad();hqG(d,id).share=!!v;hqSave(d)})
});

async function hqHome(){

async function hqClick(e){
  const b=e.target.closest("[data-ha]");if(!b)return;
  const a=b.dataset.ha,id=b.dataset.id,x=b.dataset.x;
  const done=async f=>{try{await f()}catch(err){toast(err.message||"Gagal, coba lagi")}hqHome()};
  if(a=="retry")return hqHome();
  if(a=="open"){hqOpen=id;hqMode="week";return hqHome()}
  if(a=="back"){hqOpen=null;return hqHome()}
  if(a=="form"){hqForm=hqForm==id?null:id;hqPrev=null;hqErr="";hqCode="";return hqHome()}
  if(a=="mode"){hqMode=id;return hqHome()}
  if(a=="skip"){ls.set("demo:skip",ls.get("demo:skip")=="1"?"0":"1");return hqHome()}
  if(a=="create"){const n=($("hqn").value||"").trim().slice(0,30);if(n.length<3){hqErr="Nama Halaqah minimal 3 huruf.";return hqHome()}return done(async()=>{const g=await Api.hqCreate(n);hqForm=null;hqErr="";hqOpen=g.id;toast("Halaqah dibuat")})}
  if(a=="check"){hqCode=($("hqc").value||"").trim().toUpperCase();hqPrev=null;hqErr=hqCode?"":"Masukkan kode undangan.";return hqHome()}
  if(a=="join")return done(async()=>{await Api.hqAccept(id);hqForm=null;hqPrev=null;hqCode="";toast("Berhasil bergabung")});
  if(a=="accept")return done(async()=>{await Api.hqAccept(id);toast("Berhasil bergabung")});
  if(a=="decline"||a=="block")return done(async()=>{await Api.hqDecline(id,a=="block");toast(a=="block"?"Ditolak, pengundang diblokir":"Undangan ditolak")});
  if(a=="share")return done(()=>Api.hqShare(hqOpen,x=="1"));
  if(a=="copy"){const url=location.origin+location.pathname+"?halaqah="+x;try{await navigator.clipboard.writeText(url);toast("Link undangan disalin")}catch(_){toast("Salin manual: "+url)}return}
  if(a=="newcode")return dlg("Buat kode baru? Kode lama tidak bisa dipakai lagi.","Buat kode baru",()=>done(()=>Api.hqNewCode(hqOpen)));
  if(a=="kick")return dlg("Keluarkan anggota ini dari Halaqah?","Keluarkan",()=>done(()=>Api.hqKick(hqOpen,id)));
  if(a=="transfer")return dlg("Serahkan kepemimpinan ke anggota ini? Kamu menjadi anggota biasa.","Serahkan",()=>done(()=>Api.hqTransfer(hqOpen,id)));
  if(a=="leave")return dlg("Keluar dari Halaqah ini?","Keluar",()=>done(async()=>{await Api.hqLeave(hqOpen);hqOpen=null;toast("Kamu keluar dari Halaqah")}));
  if(a=="del")return dlg("Hapus Halaqah ini? Tindakan ini tidak bisa dibatalkan.","Hapus",()=>done(async()=>{await Api.hqLeave(hqOpen);hqOpen=null;toast("Halaqah dihapus")}));
}

let stR=7;
function stChart(days,f,tf,label){
  const n=days.length,W=320,H=112,bh_=H-20,bw=W/n,mx=Math.max(15,...days.map(c=>Math.max(c.e[f],c[tf])));
  let g=`<line x1="0" y1="${bh_}" x2="${W}" y2="${bh_}" style="stroke:var(--bd)" stroke-width="1"/>`;
  days.forEach((c,i)=>{
    const x=i*bw+bw*.15,w=Math.max(3,bw*.7),v=c.e[f],h=v/mx*(bh_-4),tg=c[tf];
    if(v>0)g+=`<rect x="${x.toFixed(1)}" y="${(bh_-h).toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="2" style="fill:${tg>0&&v>=tg?"var(--ok)":"var(--p)"}"/>`;
    if(tg>0){const y=bh_-tg/mx*(bh_-4);g+=`<line x1="${x.toFixed(1)}" y1="${y.toFixed(1)}" x2="${(x+w).toFixed(1)}" y2="${y.toFixed(1)}" style="stroke:var(--t2)" stroke-width="1.5"/>`}
    const d=dparse(c.k),lb=n<=7?HS[d.getDay()]:(d.getDate()%5==0?d.getDate():"");
    if(lb!=="")g+=`<text x="${(x+w/2).toFixed(1)}" y="${H-5}" text-anchor="middle" font-size="10" style="fill:var(--t2)">${lb}</text>`;
  });
  return`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Grafik ${label} per hari">${g}</svg>`;
}
function stEst(t,L,pl,today){
  const remB=Math.max(0,Math.round(goalOf(t)*BAR)-mtNow(t)),first=Object.keys(L).sort()[0];
  if(remB==0)return{msg:"Target sudah tercapai."};
  if(!first)return{msg:"Belum ada isian ziyadah."};
  const n=Math.min(14,Math.floor((today-dparse(first))/864e5)+1);let sz=0;
  for(let i=0;i<n;i++){const d=new Date(today);d.setDate(d.getDate()-i);sz+=(L[iso(d)]||{}).z||0}
  if(n<3)return{msg:"Butuh minimal 3 hari isian untuk membuat perkiraan."};
  const avg=sz/n;if(avg<=0)return{msg:"Belum ada ziyadah dalam "+n+" hari terakhir."};
  const left=Math.ceil(remB/avg);if(left>3650)return{msg:"Kecepatan saat ini terlalu lambat untuk dibuat perkiraan."};
  const end=new Date(today);end.setDate(end.getDate()+left);
  let cmp="";if(!pl.err&&!pl.done){const df=Math.round((end-pl.last)/864e5);cmp=df<=-2?"Lebih cepat "+(-df)+" hari dari jadwal.":df>=2?"Lebih lambat "+df+" hari dari jadwal.":"Sesuai jadwal."}
  return{end,avg,cmp,n};
}
function statsHome(){
  if(SERVER&&stV=="rank")return rankHome();
  const t=tgGet();
  if(!t){$("app").innerHTML=`<h1>Statistik</h1>${stSeg()}<div class="card">Atur target hafalan dulu supaya statistik muncul.</div><button class="go" id="gt">Buka halaman Target</button>`;$("gt").onclick=()=>{tab="target";navBar();targetHome()};return}
  const L=mtGet(),pl=tgPlan(t),today=new Date();today.setHours(0,0,0,0);
  const days=[];for(let i=stR-1;i>=0;i--){const d=new Date(today);d.setDate(d.getDate()-i);days.push(mtCtx(t,L,d,pl))}
  let sz=0,sm=0,full=0,elig=0;
  days.forEach((c,i)=>{sz+=c.e.z;sm+=c.e.m;if(c.mt>0||c.zt>0){const ok=c.e.m>=c.mt&&c.e.z>=c.zt;if(ok)full++;if(ok||i<days.length-1)elig++}});
  const es=stEst(t,L,pl,today),best=lcStats(t,L,pl).best;
  const tile=(a,b)=>`<div style="background:var(--c2);border-radius:12px;padding:12px"><div class="sm">${a}</div><div style="font-size:17px;font-weight:600">${b}</div></div>`;
  $("app").innerHTML=`<h1>Statistik</h1>${stSeg()}<div class="seg"><button class="chip ${stR==7?"on":""}" data-sr="7">7 hari</button><button class="chip ${stR==30?"on":""}" data-sr="30">30 hari</button></div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px">${tile("Ziyadah",bh(sz)||"0 baris")}${tile("Murojaah",bh(sm)||"0 baris")}${tile("Hari terpenuhi",full+" dari "+elig)}${tile("Beruntun terbaik",best+" hari")}</div>
  <div class="card"><b>Ziyadah per hari</b>${stChart(days,"z","zt","ziyadah")}</div>
  <div class="card"><b>Murojaah per hari</b>${stChart(days,"m","mt","murojaah")}<div class="sm" style="margin-top:8px">Hijau: target terpenuhi · Indigo: sebagian · Garis: target hari itu</div></div>
  <div class="card"><b>Perkiraan selesai</b>${es.end?`<div style="font-size:20px;font-weight:600;margin-top:6px">${dfmt(es.end)}</div><div class="sm">Dari rata-rata ziyadah ${bh(es.avg)} per hari (${es.n} hari terakhir). ${es.cmp}</div>${!pl.err&&!pl.done?`<div class="sm" style="margin-top:4px">Jadwal awal: ${dfmt(pl.last)}</div>`:""}`:`<div class="sm" style="margin-top:6px">${es.msg}</div>`}</div>${DW}`;
  document.querySelectorAll("[data-sr]").forEach(b=>b.onclick=()=>{stR=+b.dataset.sr;statsHome()});
}
